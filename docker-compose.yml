services:
  postgres:
    image: postgres:16-alpine
    container_name: fonte-publica-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: fonte
      POSTGRES_PASSWORD: fonte
      POSTGRES_DB: fonte_publica
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fonte -d fonte_publica"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

# Railway / Nixpacks
# Migrações rodam no `npm start` (db:deploy) porque o Postgres privado
# costuma ser acessível só em runtime, não no build.

[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
startCommand = "npm run start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
